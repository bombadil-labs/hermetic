name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}, ESLint ${{ matrix.eslint }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22, eslint: 10 }
          - { os: ubuntu-latest, node: 24, eslint: 10 }
          - { os: ubuntu-latest, node: 26, eslint: 10 }
          - { os: ubuntu-latest, node: 22, eslint: 9 }
          - { os: windows-latest, node: 24, eslint: 10 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 10
        run: npm install --no-save eslint@^${{ matrix.eslint }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
