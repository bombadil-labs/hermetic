name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}, ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        eslint: [10]
        include:
          - node: 22
            eslint: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 10
        run: npm install --no-save eslint@^${{ matrix.eslint }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
