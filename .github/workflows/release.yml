name: Release

# Publishes @bombadil/hermetic and @bombadil/eslint-plugin-hermetic to npm, at
# one version, when a GitHub release is published. It uses npm trusted
# publishing: npm accepts this job's OIDC token, so no npm token is stored
# anywhere, and each version gets a provenance attestation. Run it by hand to
# rehearse: it checks, builds and packs everything, and publishes nothing.
# See RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - name: Check the tag matches both packages
        if: github.event_name == 'release'
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"
      - run: npm run check
      # Each package's prepublishOnly builds it from a clean dist first.
      - name: Publish
        if: github.event_name == 'release'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A pre-release version, such as 0.4.0-beta.1, must not become `latest`.
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          # @bombadil/hermetic goes first, because the plugin depends on it. A package
          # already published at this version is skipped, so a failed run can be rerun.
          for package in @bombadil/hermetic @bombadil/eslint-plugin-hermetic; do
            if [ "$(npm view "$package@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$package@$version is already on npm."
            else
              npm publish --workspace "$package" --provenance --access public --tag "$tag"
            fi
          done
      - name: Rehearse
        if: github.event_name != 'release'
        run: npm publish --workspaces --dry-run
